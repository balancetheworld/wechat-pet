# 两个环境共用的基础配置（Kustomize base）。
# 与环境相关的值（APP_ENV、域名、AI 开关）由 overlays/dev 与 overlays/prod 覆盖。
apiVersion: v1
kind: ConfigMap
metadata:
  name: pet-api-config
data:
  HTTP_ADDR: ":8080"

  DATABASE_DRIVER: "postgres"
  # 注意用短服务名：K8s 会自动解析到同 namespace 下的 postgres Service，
  # 因此 dev / prod 两个 namespace 可以共用同一份 base 而无需改写 DSN。
  # $(POSTGRES_PASSWORD) 由 K8s 在容器内展开，密码本体只存在于 Secret。
  DATABASE_DSN: "postgres://pet:$(POSTGRES_PASSWORD)@postgres:5432/pet?sslmode=disable"

  JWT_EXPIRE_MINUTES: "120"
  REMINDER_SEND_HOUR: "9"
  WECHAT_REMINDER_TEMPLATE_ID: ""

  STORAGE_DRIVER: "local"
  LOCAL_UPLOAD_DIR: "/app/data/uploads"

  # 项目实测未使用 Redis（配置项存在但无任何客户端代码），故不部署
  # REDIS_ADDR: ""

  AI_ENABLED: "false"
  AI_PROVIDER: "openai"
  AI_BASE_URL: "https://api.openai.com/v1"
  AI_MODEL: "gpt-5-mini"
  AI_TIMEOUT_SECONDS: "60"
  AI_REASONING_EFFORT: ""

  # 日历提醒依赖时区，勿删
  TZ: "Asia/Shanghai"
