# 开发环境差异项。
# 注意 APP_ENV=development 的两个副作用：
#   1. 订阅消息走 miniprogramState=developer，正式版收不到该环境发出的提醒；
#   2. 开启 FastPath 与调试日志，且 production 专属的校验（如强校验 AppSecret）不生效。
apiVersion: v1
kind: ConfigMap
metadata:
  name: pet-api-config
data:
  APP_ENV: "development"
  # 改成你实际的开发域名，不带结尾斜杠
  PUBLIC_BASE_URL: "https://dev-api.example.com"
  # 开发环境可以放心开，接好混元适配器后同样适用
  AI_ENABLED: "false"
